<!doctype html>
<html lang="{{ config.default_language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
  <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ get_url(path='atom.xml', trailing_slash=false) }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ config.base_url }}">{{ config.title }}</a>
    <nav>
      <a href="{{ get_url(path='@/blog/_index.md') }}">blog</a>
      <a href="{{ config.extra.repo_url }}">source</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>&copy; {{ now() | date(format='%Y') }} {{ config.extra.author }} &middot;
       <a href="{{ get_url(path='atom.xml', trailing_slash=false) }}">feed</a></p>
  </footer>
</body>
</html>
