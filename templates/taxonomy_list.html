{% extends "base.html" %}

{% block title %}{{ taxonomy.name | capitalize }} &middot; {{ config.title }}{% endblock %}

{% block content %}
<article class="section">
  <h1>{{ taxonomy.name | capitalize }}</h1>
  <ul class="post-list">
    {% for term in terms %}
    <li>
      <a href="{{ term.permalink }}">{{ term.name }}</a>
      <span class="meta">({{ term.pages | length }})</span>
    </li>
    {% endfor %}
  </ul>
</article>
{% endblock %}
