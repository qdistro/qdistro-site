when:
  - event: push
    branch: main

steps:
  build:
    image: ghcr.io/getzola/zola:v0.22.1
    entrypoint: [zola, build]

  deploy:
    image: alpine/git:latest
    environment:
      DEPLOY_KEY:
        from_secret: deploy_key
      CODEBERG_HOST_KEY:
        from_secret: codeberg_host_key
    commands:
      - apk add --no-cache openssh-client
      - mkdir -p ~/.ssh && chmod 700 ~/.ssh
      - echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
      - chmod 600 ~/.ssh/id_ed25519
      - test -n "$CODEBERG_HOST_KEY"
      - printf '%s\n' "$CODEBERG_HOST_KEY" > ~/.ssh/known_hosts
      - ssh-keygen -F codeberg.org -f ~/.ssh/known_hosts >/dev/null
      - cd public
      - git init -q -b pages
      - git config user.email "ci@qdistro.org"
      - git config user.name "qdistro CI"
      - cp ../.domains .
      - git add -A
      - git commit -q -m "build $CI_COMMIT_SHA"
      - git remote add origin git@codeberg.org:qdistro/qdistro-site.git
      - git push -f origin pages
